services:
  # ── Backend API (FastAPI + Uvicorn) ────────────────────────────────────────
  - type: web
    name: cryptopilot-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: DATABASE_URL
        sync: false          # Optional: set PostgreSQL URL or leave empty for auto-sqlite fallback
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: CRYPTOPILOT_SECRET_KEY
        generateValue: true
      - key: CRYPTOPILOT_ENV
        value: production
      - key: CRYPTOPILOT_AI_PROVIDER
        value: auto
      - key: CRYPTOPILOT_CORS_ORIGINS
        value: "*"
      - key: CRYPTOPILOT_ENABLE_REMOTE_ADVISORIES
        value: "true"

  # ── Frontend Web UI (React + Vite) ─────────────────────────────────────────
  - type: web
    name: cryptopilot-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cryptopilot-backend
          property: host
